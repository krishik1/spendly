{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<section class="analytics-section">
    <div class="analytics-card">
        <span class="analytics-decor analytics-decor-tr"></span>
        <span class="analytics-decor analytics-decor-bl"></span>

        <div class="analytics-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.8"/>
                <path d="M12 7v5l3.5 2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <span class="analytics-badge">Coming Soon</span>

        <h1 class="analytics-title">Advanced Analytics</h1>

        <p class="analytics-body">
            We're working on powerful insights and visualizations to help you
            understand your spending patterns better.
        </p>

        <div class="analytics-dots">
            <span class="analytics-dot analytics-dot-1"></span>
            <span class="analytics-dot analytics-dot-2"></span>
            <span class="analytics-dot analytics-dot-3"></span>
        </div>

        <p class="analytics-caption">We're crafting something special</p>
    </div>
</section>
{% endblock %}
